<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skrining Kesehatan — Gaya Hidup Anda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <main class="device">

    <header class="topbar">
      <a href="step2.html" class="icon-btn" aria-label="Kembali">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1 class="topbar-title">Skrining Kesehatan</h1>
      <span class="icon-btn icon-btn--muted" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 8.7-8 11-4.6-2.3-8-6-8-11V5l8-3Z"/></svg>
      </span>
    </header>

    <div class="progress-wrap">
      <div class="progress-meta"><span>LANGKAH 3 DARI 4</span><span class="step-percent">75% Selesai</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:75%"></div></div>
    </div>

    <div class="section-head">
      <h2>Gaya Hidup Anda</h2>
      <p>Kebiasaan harian sangat mempengaruhi kesehatan jangka panjang.</p>
    </div>

    <div class="fields">

      <div class="field">
        <span class="field-label">Status Merokok</span>
        <div class="option-list" role="radiogroup" aria-label="Status Merokok">
          <button type="button" class="option-item is-active" data-value="tidak-merokok">
            Tidak Merokok
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          </button>
          <button type="button" class="option-item" data-value="pernah-merokok">
            Pernah Merokok
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          </button>
          <button type="button" class="option-item" data-value="masih-merokok">
            Masih Merokok
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Aktivitas Fisik Harian</span>
        <div class="option-list" role="radiogroup" aria-label="Aktivitas Fisik Harian">
          <button type="button" class="option-item" data-value="aktif">
            Aktif (Olahraga rutin)
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          </button>
          <button type="button" class="option-item is-active" data-value="kadang">
            Kadang-kadang
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          </button>
          <button type="button" class="option-item" data-value="jarang">
            Jarang / Tidak Pernah
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Bagaimana kondisi kesehatan Anda secara umum?</span>
        <div class="emoji-scale" role="radiogroup" aria-label="Kondisi kesehatan umum">
          <button type="button" class="emoji-option" data-value="buruk">
            <span class="emoji">🙁</span><span class="emoji-label">Buruk</span>
          </button>
          <button type="button" class="emoji-option" data-value="cukup">
            <span class="emoji">😐</span><span class="emoji-label">Cukup</span>
          </button>
          <button type="button" class="emoji-option is-active" data-value="baik">
            <span class="emoji">🙂</span><span class="emoji-label">Baik</span>
          </button>
          <button type="button" class="emoji-option" data-value="sangat-baik">
            <span class="emoji">😊</span><span class="emoji-label">Sangat Baik</span>
          </button>
          <button type="button" class="emoji-option" data-value="prima">
            <span class="emoji">😄</span><span class="emoji-label">Prima</span>
          </button>
        </div>
      </div>

    </div>

    <div class="btn-row">
      <a href="step2.html" class="btn btn-secondary">Kembali</a>
      <a href="loading.html" class="btn btn-primary">Lihat Hasil</a>
    </div>

  </main>
</div>
<script src="script.js"></script>
</body>
</html>
